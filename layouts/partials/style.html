<style>
/* Adapté de buchh.org (MIT, Jonathan Buchholz). Couleurs, fond blanc cassé, texte noir, étoiles et soulignés vert olive. */
:root {
  --bg: #FAFAF8;
  --fg: #1A1A1A;
  --muted: #5C5A55;
  --accent: #3D481A;
  --rule: var(--accent);
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: 20px;
  line-height: 1.6;
  overflow-y: scroll;
  font-size: 1.15em;
}
.limiter, main {
  max-width: 640px;
  padding-left: 20px;
  padding-right: 20px;
  margin-left: auto;
  margin-right: auto;
}
a { color: var(--fg); text-decoration-color: var(--accent); }
.accent { color: var(--accent); }
li::marker { color: var(--accent); }
/* Lien vers la photo, aligné à droite du nom sur l'accueil */
.home-title { position: relative; }
.photo-link { position: absolute; right: 0; bottom: 0.35em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 1rem; }
/* L'étoile de la page courante ne doit pas élargir le menu */
nav li { position: relative; }
nav .current { position: absolute; margin-left: 0.3em; }
p { text-align: justify; }
blockquote { font-style: italic; }
h1:first-child { margin-top: 0; }
h1, h2, h3 {
  font-family: Georgia, "Times New Roman", Times, serif;
  font-weight: normal;
  line-height: 1.25;
  border-bottom: 1px solid var(--accent);
  margin-bottom: 0;
}
h3 { border-bottom: 0; font-style: italic; margin-top: 1.2em; }
h1::before { content: "✱ "; color: var(--accent); margin-bottom: 0.5rem; }
hr { height: 1px; background: var(--rule); border: 0; }
img { border-radius: 5px; }
small, .muted { color: var(--muted); }
.inline-image {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  flex-wrap: wrap;
}
.inline-image img { max-width: 175px; height: 175px; object-fit: cover; margin-top: 20px; }
.inline-image p { flex-grow: 1; margin-top: 15px; }
/* Références en APA : retrait suspendu */
.refs p, ul.refs li { text-align: left; padding-left: 1.5em; text-indent: -1.5em; }
ul.refs { list-style: none; padding-left: 0; }
.entry { margin: 1em 0 0.2em 0; text-align: left; }
.entry + p, .entry + ul { margin-top: 0.1em; }
.dates { color: var(--muted); }
.cv-embed { width: 100%; height: calc(100vh - 230px); min-height: 360px; border: 0; background: transparent; display: block; margin-top: 1em; }
nav .lang a { margin-right: 0.6em; }
@media screen and (min-width:1100px) {
  nav { position: absolute; top: 20px; left: 20px; margin: 0 !important; padding: 0; max-width: none; }
  nav hr { display: none; }
  .inline-image { flex-wrap: nowrap; }
}
@media screen and (max-width:700px) {
  .limiter, main { width: auto; padding: 0; }
  body { padding: 12px; }
  hr { margin-top: 0; }
  p { text-align: left; }
  .photo-link { position: static; display: block; text-align: right; font-size: 0.9rem; }
}
</style>
