<style>
/* Adapté de buchh.org (MIT, Jonathan Buchholz). Couleurs, fond blanc cassé, texte noir, étoiles et soulignés vert olive. */
:root {
  --bg: #FAFAF8;
  --fg: #1A1A1A;
  --muted: #5C5A55;
  --accent: #3D481A;
  --rule: var(--accent);
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: 20px;
  line-height: 1.6;
  overflow-y: scroll;
  font-size: 1.15em;
  margin: 0;
}
/* Pied de page toujours collé en bas de la fenêtre */
main { min-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.limiter, main {
  max-width: 640px;
  padding-left: 20px;
  padding-right: 20px;
  margin-left: auto;
  margin-right: auto;
}
a { color: var(--fg); text-decoration-color: var(--accent); }
.accent { color: var(--accent); }
li::marker { color: var(--accent); }
/* Lien vers la photo, aligné à droite du nom sur l'accueil */
.home-title { position: relative; }
.contact { display: flex; flex-wrap: wrap; gap: 0.4em 1.4em; }
.contact a { display: inline-flex; align-items: center; gap: 0.4em; }
.contact svg { width: 1.05em; height: 1.05em; fill: var(--accent); color: var(--accent); flex: none; }
.photo-link { position: absolute; right: 0; bottom: 0.35em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 1rem; }
/* L'étoile de la page courante ne doit pas élargir le menu */
nav li { position: relative; }
nav .current { position: absolute; margin-left: 0.3em; }
p { text-align: justify; }
blockquote { font-style: italic; }
h1:first-child { margin-top: 0; }
h1, h2, h3 {
  font-family: Georgia, "Times New Roman", Times, serif;
  font-weight: normal;
  line-height: 1.25;
  border-bottom: 1px solid var(--accent);
  margin-bottom: 0;
}
h3 { border-bottom: 0; font-style: italic; margin-top: 1.2em; }
/* Titre de page sans ligne, un peu d'air avant le premier sous-titre */
h1 { border-bottom: 0; margin-bottom: 0.6em; }
h1::before { content: "✱ "; color: var(--accent); margin-bottom: 0.5rem; }
hr { height: 1px; background: var(--rule); border: 0; }
img { border-radius: 5px; }
small, .muted { color: var(--muted); }
.inline-image {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  flex-wrap: wrap;
}
.inline-image img { max-width: 175px; height: 175px; object-fit: cover; margin-top: 20px; }
.inline-image p { flex-grow: 1; margin-top: 15px; }
/* Références en APA : retrait suspendu */
.refs p, ul.refs li { text-align: left; padding-left: 1.5em; text-indent: -1.5em; }
ul.refs { list-style: none; padding-left: 0; }
.entry { margin: 1em 0 0.2em 0; text-align: left; }
.entry + p, .entry + ul { margin-top: 0.1em; }
.dates { color: var(--muted); }
.cv-pages { width: 100%; overflow-y: auto; margin: 0.5em auto 0 auto; border: 2px solid var(--accent); box-sizing: border-box; scroll-snap-type: y mandatory; aspect-ratio: 1400 / 1812; }
/* Une page entière du CV par hauteur de cadre */
.cv-pages img { display: block; width: 100%; height: auto; border-radius: 0; margin: 0; scroll-snap-align: start; }
.cv-pages img + img { border-top: 2px solid var(--accent); }
/* Deux rats à l'encre traversent le bas de la fenêtre (déplacement géré par le script de partials/rat.html) */
.rat-track { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; overflow: hidden; pointer-events: none; z-index: 10; }
.rat { position: absolute; bottom: 2px; left: 0; width: 145px; visibility: hidden; }
.rat svg { display: block; width: 145px; height: auto; }
.rat .patte { transform-box: fill-box; transform-origin: 50% 0; }
.rat .loin { opacity: 0.5; }
/* Trot : les pattes en diagonale avancent ensemble, levées pendant le retour vers l'avant */
.rat.court svg { animation: rat-rebond 0.13s ease-in-out infinite alternate; }
.rat.court .patte { animation: rat-pas 0.26s linear infinite; }
.rat.court .patte.b { animation-delay: -0.13s; }
.rat .museau { transform-box: fill-box; transform-origin: 100% 40%; }
.rat.renifle .museau { animation: rat-renifle 0.16s ease-in-out infinite alternate; }
@keyframes rat-pas {
  0% { transform: rotate(24deg); }
  58% { transform: rotate(-24deg); }
  80% { transform: translateY(-2.5px) rotate(4deg); }
  100% { transform: rotate(24deg); }
}
@keyframes rat-rebond { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
@keyframes rat-renifle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@media (prefers-reduced-motion: reduce) { .rat-track { display: none; } }
nav .lang a { margin-right: 0.6em; }
@media screen and (min-width:1100px) {
  nav { position: absolute; top: 20px; left: 20px; margin: 0 !important; padding: 0; max-width: none; }
  /* Page CV : la page ne défile pas, seules les pages du CV défilent dans leur cadre */
  body:has(.cv-pages) { overflow: hidden; height: 100vh; box-sizing: border-box; }
  main:has(.cv-pages) { height: calc(100vh - 40px); }
  .page:has(.cv-pages) { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  main .cv-pages { flex: 1; min-height: 0; height: auto; width: auto; max-width: 100%; }
  nav hr { display: none; }
  .inline-image { flex-wrap: nowrap; }
}
/* Tablette et téléphone : menu sur une seule ligne au-dessus du contenu */
@media screen and (max-width:1099px) {
  nav ul { display: flex; flex-wrap: wrap; column-gap: 1.1em; row-gap: 0.2em; align-items: baseline; }
  nav li.lang { margin-left: auto; }
  nav .lang a { margin-right: 0; }
  nav .current { display: none; }
  nav li.actif a { text-decoration: none; color: var(--accent); }
  nav hr { margin: 0.6em 0 0 0; }
}
@media screen and (max-width:700px) {
  .limiter, main { width: auto; padding: 0; }
  body { padding: 14px 16px; font-size: 1.05em; }
  main { min-height: 0; }
  nav { font-size: 0.92rem; }
  nav ul { column-gap: 0.9em; }
  hr { margin-top: 0; }
  p { text-align: left; }
  h1 { font-size: 1.85em; margin-bottom: 0.4em; }
  nav { margin-bottom: 1.6em; }
  .rat-track { display: none; }
  h2 { font-size: 1.35em; margin-top: 1.4em; }
  /* Le lien vers la photo passe sous le nom, en petit */
  .photo-link { position: static; display: block; text-align: left; font-size: 0.85rem; margin-top: 0.15em; color: var(--muted); }
  /* CV : les pages s'empilent, sans cadre qui défile à l'intérieur de la page */
  .cv-pages { aspect-ratio: auto; height: auto; overflow: visible; border: 0; scroll-snap-type: none; }
  .cv-pages img { border: 1px solid var(--accent); margin-bottom: 0.8em; }
  .cv-pages img + img { border-top: 1px solid var(--accent); }
  ul { padding-left: 1.2em; }
}
</style>
