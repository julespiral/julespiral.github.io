{{- /* Image du jour : data/photo.json, écrit chaque matin par scripts/photo_du_jour.py (workflow photo-du-jour). */ -}}
{{- with hugo.Data.photo }}
{{- $fr := eq site.Language.Lang "fr" }}
<figure class="photo-du-jour">
  <a href="{{ .lien }}" target="_blank" rel="noopener"><img src="{{ .image }}" alt="{{ .titre }}" decoding="async" onerror="this.closest('figure').remove()"></a>
  <figcaption>
    <span class="etiquette">{{ if $fr }}Image du jour{{ else }}Picture of the day{{ end }}</span>
    <a href="{{ .lien }}" target="_blank" rel="noopener"><em>{{ .titre }}</em></a>
    {{- $credit := slice }}
    {{- with .auteur }}{{ $credit = $credit | append . }}{{ end }}
    {{- with .date }}{{ $credit = $credit | append . }}{{ end }}
    {{- $credit = $credit | append .source }}
    {{- with .licence }}{{ $credit = $credit | append (cond (and $fr (eq . "Domaine public")) . (cond (eq . "Domaine public") "Public domain" .)) }}{{ end }}
    <span class="credit">{{ delimit $credit ", " }}</span>
  </figcaption>
</figure>
{{- end }}
