# Menus du site, un par langue.
#
# `main` = menu anglais (pages à la racine : /publications/, /cv/, ...)
# `fr`   = menu français (pages sous /fr/)
#
# Le masthead (_includes/masthead.html) choisit la liste selon le champ
# `lang:` déclaré dans l'en-tête YAML de chaque page.
#
# Pour retirer un onglet du menu, supprime son bloc ici : la page continue
# d'exister, elle n'apparaît simplement plus dans la barre de navigation.

main:
  - title: "Research"
    url: /research/

  - title: "Publications"
    url: /publications/

  - title: "Talks"
    url: /talks/

  - title: "Teaching"
    url: /teaching/

  - title: "CV"
    url: /cv/

fr:
  - title: "Recherche"
    url: /fr/recherche/

  - title: "Publications"
    url: /fr/publications/

  - title: "Communications"
    url: /fr/communications/

  - title: "Enseignement"
    url: /fr/enseignement/

  - title: "CV"
    url: /fr/cv/
